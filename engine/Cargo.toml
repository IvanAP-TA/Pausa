[package]
name = "pausa-engine"
version = "0.1.0"
edition = "2021"
description = "Pausa's recommendation engine, compiled to WebAssembly and loaded by the Worker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
