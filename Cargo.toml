[workspace]
resolver = "2"
members = ["crates/engine", "crates/core", "crates/api"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
