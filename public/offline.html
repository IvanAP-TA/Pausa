<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pausa</title>
    <style>
      /* Darkroom tokens, copied from src/app/tokens.css: this page is cached and shown with no connection, so it carries its own. */
      :root {
        color-scheme: dark;
        --color-paper: oklch(12.5% 0.008 55);
        --color-paper-3: oklch(20.5% 0.01 55);
        --color-ink: oklch(92% 0.012 78);
        --color-ink-2: oklch(80% 0.012 75);
        --color-rule: oklch(29% 0.01 55);
        --color-accent: oklch(73% 0.15 58);
        --color-accent-hover: oklch(79% 0.14 62);
        --color-accent-ink: oklch(12.5% 0.008 55);
        --color-focus: oklch(73% 0.15 58);
        /* No web font offline: the two faces if the device has them, then the nearest system cuts. */
        --font-display: "Sofia Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", ui-sans-serif, sans-serif;
        --font-body: "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --color-paper: oklch(95% 0.01 80);
          --color-paper-3: oklch(87.5% 0.014 76);
          --color-ink: oklch(14% 0.006 40);
          --color-ink-2: oklch(30% 0.008 45);
          --color-rule: oklch(80% 0.014 70);
          --color-accent: oklch(50% 0.2 30);
          --color-accent-hover: oklch(44% 0.19 30);
          --color-accent-ink: oklch(97% 0.01 80);
          --color-focus: oklch(50% 0.2 30);
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { overflow-x: clip; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; align-content: center; padding: 24px 16px; background: var(--color-paper); color: var(--color-ink); font: 400 16px/1.5 var(--font-body); }
      main { width: 100%; max-width: 40rem; margin: 0 auto; min-width: 0; }
      .mark { display: inline-flex; gap: 7px; margin-bottom: 24px; }
      .mark i { display: block; width: 10px; height: 40px; background: var(--color-ink); }
      h1 { margin: 0 0 16px; font: 200 clamp(2.75rem, 6.5vw, 5.5rem)/1 var(--font-display); text-transform: uppercase; letter-spacing: -0.005em; overflow-wrap: break-word; text-wrap: balance; }
      p { margin: 0 0 32px; max-width: 45ch; color: var(--color-ink-2); font-size: 1.2rem; line-height: 1.5; }
      button { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 40px; border: 1px solid var(--color-accent); border-radius: 0; background: var(--color-accent); color: var(--color-accent-ink); font: 400 1.44rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; cursor: pointer; transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1), border-color 120ms cubic-bezier(0.16, 1, 0.3, 1), transform 120ms cubic-bezier(0.16, 1, 0.3, 1); }
      button:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
      @media (max-width: 40rem) { button { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><i></i><i></i></div>
      <h1 id="t"></h1>
      <p id="b"></p>
      <button id="r" type="button"></button>
    </main>
    <script>
      // The page is cached once and shown with no connection, so it picks its language from the browser.
      var all = {
        it: ["Sei offline", "Pausa ha bisogno di una connessione per aprire la tua Cerchia. Riprova appena sei di nuovo online.", "Riprova"],
        en: ["You are offline", "Pausa needs a connection to open your Cerchia. Try again as soon as you are back online.", "Try again"],
        es: ["Estás sin conexión", "Pausa necesita conexión para abrir tu Cerchia. Inténtalo de nuevo cuando vuelvas a tener internet.", "Reintentar"],
      };
      var lang = (navigator.language || "it").slice(0, 2);
      var s = all[lang] || all.it;
      document.documentElement.lang = all[lang] ? lang : "it";
      document.title = "Pausa · " + s[0];
      document.getElementById("t").textContent = s[0];
      document.getElementById("b").textContent = s[1];
      var r = document.getElementById("r");
      r.textContent = s[2];
      r.addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
