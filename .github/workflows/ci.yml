name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  engine:
    name: Rust engine (unit tests, rebuild, parity with TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: npm ci
      - run: cargo test --manifest-path engine/Cargo.toml
      # Rebuild engine.wasm from the sources and prove it still matches the TypeScript reference.
      - run: npm run engine:build
      - run: npx vitest run src/lib/engine

  e2e:
    name: End-to-end (Playwright, with accessibility audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env.local
      - run: echo "BETTER_AUTH_SECRET=ci-only-secret-ci-only-secret-ci-only" >> .env.local
      - run: npm run db:reset:local
      - run: npx playwright test --project=desktop
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
