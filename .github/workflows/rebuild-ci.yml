name: Rebuild CI (Rust + schema)

# Linux runners only: the free private-repo allowance is $12/month of compute and Windows minutes cost more than Linux.
on:
  push:
    branches: [main]
    paths: ["crates/**", "migrations/**", "tools/**", "packages/api-types/**", "Cargo.*", ".cargo/**"]
  pull_request:
    paths: ["crates/**", "migrations/**", "tools/**", "packages/api-types/**", "Cargo.*", ".cargo/**"]

jobs:
  rust:
    name: fmt, clippy, tests, WASM build, type drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also regenerates packages/api-types (ts-rs writes there during the tests).
      - run: cargo test --workspace
      # The generated TypeScript must be committed: a changed Rust type with stale .ts files fails here.
      - run: git diff --exit-code -- packages/api-types
      - run: cargo build -p pausa-api --target wasm32-unknown-unknown --release

  e2e:
    name: API end-to-end (wrangler dev + D1 local + mock catalogue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.9.0
      - run: command -v worker-build || cargo install worker-build --version 0.9.0 --locked
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # The repository root still carries the old app's dependencies; wrangler comes from there.
      - run: npm ci --ignore-scripts
      - run: node tools/run-smoke.mjs

  schema:
    name: migrations load into SQLite and hot queries use indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --no-warnings tools/check-schema.mjs migrations/0001_init.sql
